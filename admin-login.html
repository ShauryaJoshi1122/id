<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Portal Login</title>
    <meta
      name="description"
      content="Secure Admin Portal for Member Management and ID Card Verification."
    />

    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/jpg" href="images/logo.jpg" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
      body {
        background-color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .admin-card-container {
        max-width: 440px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 36px 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
        border: 1px solid #e2e8f0;
      }
      .brand-badge-center {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }
      .passcode-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 24px 0 20px;
        color: #94a3b8;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .passcode-divider::before,
      .passcode-divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e2e8f0;
      }
      .passcode-divider:not(:empty)::before {
        margin-right: .75em;
      }
      .passcode-divider:not(:empty)::after {
        margin-left: .75em;
      }
      .credentials-box {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 22px;
        font-size: 0.88rem;
        color: #1e40af;
      }
      .credentials-box strong {
        color: #1e3a8a;
      }
      .credentials-box code {
        background: #dbeafe;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-weight: bold;
        color: #1d4ed8;
      }
      .admin-input-group {
        margin-bottom: 16px;
        text-align: left;
      }
      .admin-input-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #334155;
      }
      .admin-input-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .admin-submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      }
      .admin-submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      }
    </style>
  </head>

  <body>
    <!-- Top Bar -->
    <header class="app-header" style="background:#fff; padding: 12px 24px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
        <div style="width:40px; height:40px; background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <span style="font-size:1.2rem; font-weight:700; color:#0f172a;">Admin Control Panel</span>
      </a>
      <a href="index.html" style="text-decoration:none; color:#2563eb; font-weight:600; font-size:0.9rem;">&larr; Back to Home</a>
    </header>

    <main style="flex:1; padding: 20px;">
      <div class="admin-card-container">
        <div class="brand-badge-center">
          <div style="width:64px; height:64px; background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius:16px; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 20px rgba(37,99,235,0.25);">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
        </div>

        <h1 style="text-align: center; font-size: 1.5rem; color: #0f172a; margin: 0 0 6px;">
          Administrator Login
        </h1>
        <p style="text-align: center; color: #64748b; font-size: 0.92rem; margin: 0 0 20px;">
          Control panel for ID card approvals, member management, and portal configuration
        </p>

       

        <div id="loginInfo" class="info-message" style="display: none; background: #eff6ff; color: #1e40af; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 0.9rem;"></div>
        <div id="loginError" class="error-message" style="display: none; background: #fef2f2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 0.9rem;"></div>
        <div id="loginLoading" style="display: none; text-align: center; padding: 10px; color: #2563eb; font-weight: 600;">Authenticating...</div>

        <!-- FORM: Direct Passcode Login -->
        <form id="adminPasscodeForm">
          <div class="admin-input-group">
            <label for="adminEmailInput">Admin Email</label>
            <input type="email" id="adminEmailInput" value="admin@portal.com" placeholder="eamil.oo" required />
          </div>

          <div class="admin-input-group">
            <label for="adminPasscodeInput">Admin Passcode / Master PIN</label>
            <input type="password" id="adminPasscodeInput" placeholder="Enter Password" required />
          </div>

          <button type="submit" id="adminPasscodeBtn" class="admin-submit-btn">
            Login with Passcode &rarr;
          </button>
        </form>

        <div class="passcode-divider">OR</div>

      
      </div>
    </main>

    <script type="module" src="js/pages/admin-login.js"></script>
  </body>
</html>
